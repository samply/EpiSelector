name: Build and Push EpiSelector German Images

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:
    branches:
      - master

jobs:
  django-backend:
    permissions:
      contents: read
      packages: write
      pull-requests: read
      security-events: write
      statuses: read
    uses: samply/github-workflows/.github/workflows/docker-ci.yml@main
    with:
      image-name: "samply/episelector-web-backend"
      image-tag-suffix: "-de"
      build-context: "./backend/django_backend"
      build-file: "./backend/django_backend/Dockerfile"
      build-platforms: "linux/amd64"
      push-to: docker.io
      ghcr-retention-policy: keep
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  statistic-api:
    permissions:
      contents: read
      packages: write
      pull-requests: read
      security-events: write
      statuses: read
    uses: samply/github-workflows/.github/workflows/docker-ci.yml@main
    with:
      image-name: "samply/episelector-statistics-backend"
      image-tag-suffix: "-de"
      build-context: "./backend/statistic_api"
      build-file: "./backend/statistic_api/Dockerfile"
      build-platforms: "linux/amd64"
      push-to: docker.io
      ghcr-retention-policy: keep
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  frontend:
    permissions:
      contents: read
      packages: write
      pull-requests: read
      security-events: write
      statuses: read
    uses: samply/github-workflows/.github/workflows/docker-ci.yml@main
    with:
      image-name: "samply/episelector-frontend"
      image-tag-suffix: "-de"
      build-context: "./frontend"
      build-file: "./frontend/Dockerfile.prod"
      build-platforms: "linux/amd64"
      push-to: docker.io
      ghcr-retention-policy: keep
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  dockerhub-readme:
    name: Update Docker Hub README
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs:
      - django-backend
      - statistic-api
      - frontend
    strategy:
      fail-fast: false
      matrix:
        repository:
          - samply/episelector-web-backend
          - samply/episelector-statistics-backend
          - samply/episelector-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync README to Docker Hub
        uses: lablans/sync-dockerhub-readme@feature/replace-patterns
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ matrix.repository }}
          readme: "./README.txt"
          replace_pattern: "](./"
          replace_with: "](https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/"
