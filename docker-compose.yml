version: '3.8'

services:
  # PostgreSQL Datenbank
  db:
    image: postgres:15
    container_name: episelector-db
    environment:
      POSTGRES_DB: episelector
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - episelector-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # R Backend (Plumber API)
  r-backend:
    image: samply/episelector-statistics-backend:${EPISELECTOR_IMAGE_TAG:-englishversion-en}
    pull_policy: missing
    build:
      context: ./backend/statistic_api
      dockerfile: Dockerfile
    container_name: episelector-r-backend
    networks:
      - episelector-network
    working_dir: /app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3420/test"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Django Backend
  django-backend:
    image: samply/episelector-web-backend:${EPISELECTOR_IMAGE_TAG:-englishversion-en}
    pull_policy: missing
    build:
      context: ./backend/django_backend
      dockerfile: Dockerfile
    container_name: episelector-django-backend
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/episelector
      - R_BACKEND_URL=http://r-backend:3420
    volumes:
      - ${DJANGO_LOCAL_SETTINGS:-./config/django/local_settings.dev.py}:/app/django_backend/local_settings.py:ro
    depends_on:
      db:
        condition: service_healthy
      r-backend:
        condition: service_healthy
    networks:
      - episelector-network
    # entrypoint.sh waits for the database, runs migrate and collectstatic, then starts this command
    command: >
      gunicorn django_backend.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      --timeout 300
      --access-logfile -

  # React Frontend
  frontend:
    image: samply/episelector-frontend:${EPISELECTOR_IMAGE_TAG:-englishversion-en}
    pull_policy: missing
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: episelector-frontend
    ports:
      - "3000:80"
    depends_on:
      - django-backend
    networks:
      - episelector-network

volumes:
  postgres_data:

networks:
  episelector-network:
    driver: bridge