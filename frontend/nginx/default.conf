server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Forward API calls to the Django backend, so the frontend can use same-origin URLs.
    # The upstream is resolved per request through Docker's DNS, so nginx also starts without the backend.
    resolver 127.0.0.11 valid=30s ipv6=off;
    location ~ ^/(api|control_selection)/ {
        set $django_backend http://django-backend:8000;
        proxy_pass $django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Uploaded datasets travel in the request body, and matching in R can take a while.
        client_max_body_size 200m;
        proxy_read_timeout 300s;
    }

    # Serve the React single-page app and fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets generated by the React build.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
